# Render Web Service: Express API ONLY. React frontend is deployed on Vercel.
# Keep Root Directory blank so npm workspaces resolve correctly.
services:
  - type: web
    name: learnora-lms-api
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
